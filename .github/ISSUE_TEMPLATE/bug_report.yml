name: Bug report
description: Report an incorrect finding, crash, or unexpected output.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private source code and secrets before submitting.
  - type: input
    id: version
    attributes:
      label: Tailwind Doctor version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
