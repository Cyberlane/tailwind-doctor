name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed release tag to recover
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify the signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA=$(git rev-parse HEAD) scripts/verify-release-tag.sh "$RELEASE_TAG"
      - run: scripts/check-release-version.sh "$RELEASE_TAG"
      - run: gofmt -l . | tee /tmp/unformatted && test ! -s /tmp/unformatted
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: npm test --prefix npm
      - run: npm test --prefix editors/vscode
      - name: Test the versioned documentation site
        run: scripts/test-site.sh "$RELEASE_TAG"
      - name: Install Neovim 0.11
        env:
          NVIM_SHA256: b2f91117be5b5ea39edd7297156dc2a4a8df4add6c95a90809a8df19e7ab6f52
          NVIM_VERSION: v0.11.5
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/nvim.tar.gz --directory /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: editors/neovim/test.sh
      - name: Test release archives and npm launchers
        run: scripts/test-release.sh
      - name: Check the public repository boundary
        run: scripts/check-public.sh
      - name: Build release archives and npm packages
        run: scripts/build-release.sh "$RELEASE_TAG" "$GITHUB_WORKSPACE/dist"
      - name: Verify release checksums
        run: cd dist/release && shasum -a 256 -c SHA256SUMS
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Publish npm packages with trusted publishing
        run: scripts/publish-npm.sh "$GITHUB_WORKSPACE/dist"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" dist/release/*
          --verify-tag
          --title "Tailwind Doctor $RELEASE_TAG"
          --notes-file "docs/release-notes/$RELEASE_TAG.md"
          --latest

  deploy-pages:
    name: Deploy the release documentation
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
