name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # The module has no dependencies, so there is no go.sum to key a cache on.
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Check the public repository boundary
        run: scripts/check-public.sh

  extraction-accuracy:
    # Kept separate from the test job so that a red build reads as "extraction
    # regressed" rather than "a test failed". The gate is the committed baseline
    # in testdata/corpus/baseline.json; see docs/extraction-accuracy.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Measure extraction against the fixture corpus
        run: go test ./internal/audit -run 'TestCorpusGroundTruthIsWellFormed|TestExtractionAccuracy' -v

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm test --prefix npm
      - run: npm test --prefix editors/vscode
      - name: Install Neovim 0.11
        env:
          NVIM_SHA256: b2f91117be5b5ea39edd7297156dc2a4a8df4add6c95a90809a8df19e7ab6f52
          NVIM_VERSION: v0.11.5
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/nvim.tar.gz --directory /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: editors/neovim/test.sh
      - run: scripts/test-release.sh

  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Build and run the native CLI
        shell: bash
        run: |
          executable=tw-doctor
          if [[ $RUNNER_OS == Windows ]]; then executable=tw-doctor.exe; fi
          go build -trimpath -o "$executable" ./cmd/tw-doctor
          output=$(./"$executable" --version)
          [[ $output == "tw-doctor "* ]]
          [[ ${output#"tw-doctor "} != "" ]]
